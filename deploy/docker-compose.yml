# API server: API + Caddy (HTTPS) + Redis. The database (Neon) and files (Neon Object Storage) stay outside.
# Lives on the server in /opt/pet-app next to `.env` (secrets, created by hand, never in the repository).
# Step-by-step setup: apps/api/README.md.
name: pet-app

services:
  api:
    # Built by the deploy workflow and loaded over SSH; no registry involved.
    image: pet-app-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    # Not published: only Caddy reaches it.
    expose:
      - '3000'

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env, e.g. api.example.com}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates: keep across restarts, or Let's Encrypt rate limits will bite.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Admin panel for map places (manual verification, moderation queue). Off until the owner creates
  # `directus.env` and adds COMPOSE_PROFILES=admin to `.env` — see apps/api/README.md.
  directus:
    profiles: ['admin']
    image: directus/directus:12.7.0
    restart: unless-stopped
    # SECRET, DB_CONNECTION_STRING, ADMIN_EMAIL, ADMIN_PASSWORD. Kept apart from `.env`, so the API never sees them.
    env_file:
      - path: directus.env
        required: false
    environment:
      DB_CLIENT: pg
      # Its own tables live in the `directus` schema; from ours it sees only `places` (deploy/directus/setup.sql).
      DB_SEARCH_PATH: array:directus,public
      PUBLIC_URL: https://${API_DOMAIN}/cms
      TELEMETRY: 'false'
      RATE_LIMITER_ENABLED: 'true'
      RATE_LIMITER_POINTS: '50'
      RATE_LIMITER_DURATION: '1'
    expose:
      - '8055'

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Queue data must survive a restart and must never be evicted silently.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  redis_data:
