name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Ready for a merge queue: checks then run on the PR merged with the latest main (#84).
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # The journal order is a unit test in packages/db (migrations.test.ts). Here: the schema and the last snapshot
      # agree — `generate` must find nothing to write, or a migration is missing from the PR (#84).
      - name: Migrations match the schema
        run: |
          pnpm -F @pet-app/db generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            git status --porcelain packages/db/migrations
            echo "::error::The schema changed without a migration. Run pnpm -F db generate and commit the result."
            exit 1
          fi

  db-tests:
    name: repositories on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same major versions as Neon: PostgreSQL 17 + PostGIS 3.5.
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # A throwaway container: the password is not a secret. Tests refuse any host but localhost.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Creates a database, applies packages/db/migrations and runs every `*.db.test.ts` (ADR-0012).
      - run: pnpm test:db
